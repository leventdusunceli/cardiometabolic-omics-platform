services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cmo}
      POSTGRES_DB: ${POSTGRES_DB:-cmo_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cmo} -d ${POSTGRES_DB:-cmo_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # api, worker, and pipeline services are added in later build-order steps,
  # once there is application code for them to run.

volumes:
  postgres_data:
